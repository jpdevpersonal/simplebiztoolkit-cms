name: Staging Deployment

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - staging

jobs:
  deploy_smoke_checks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/reusable-deploy-smoke-checks.yml
    with:
      api_url: https://simplebiztoolkit-api-test.azurewebsites.net
      skip_api_ping: ${{ vars['CI_SKIP_API_PING_STAGING'] == 'true' }}
      skip_playwright_tests: ${{ vars['CI_SKIP_PLAYWRIGHT_STAGING'] == 'true' }}
    secrets: inherit

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: deploy_smoke_checks
    runs-on: ubuntu-latest
    name: Deploy to Azure

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
          NEXT_PUBLIC_API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
          NEXT_PUBLIC_SHOW_FREE_GUIDE_BUTTON: "false"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MUSHROOM_09D02E403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MUSHROOM_09D02E403 }}
          app_location: "/"
          action: "close"
