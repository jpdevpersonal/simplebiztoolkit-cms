name: PR Validation Quality Checks
# quality checks and playwright.
on:
  pull_request:

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
      NEXT_PUBLIC_API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder-secret-not-used-in-tests' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'ci@example.com' }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH || '$2b$10$placeholder' }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET || 'ci-revalidation-placeholder' }}
      SKIP_API_PING: ${{ vars['CI_SKIP_API_PING_PR'] || 'false' }}
      SKIP_PLAYWRIGHT_TESTS: ${{ vars['CI_SKIP_PLAYWRIGHT_PR'] || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        if: ${{ env.SKIP_PLAYWRIGHT_TESTS != 'true' }}
        run: npx playwright install chromium

      - name: Verify API is reachable
        if: ${{ env.SKIP_API_PING != 'true' }}
        run: |
          curl --fail --silent --show-error --max-time 15 \
            "${API_URL}/api/menuitems" \
            > /dev/null

      - name: Run Playwright e2e tests
        if: ${{ env.SKIP_PLAYWRIGHT_TESTS != 'true' }}
        run: npx playwright test
