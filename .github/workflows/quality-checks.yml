name: PR Validation Quality Checks
# quality checks
on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
      NEXT_PUBLIC_API_URL: https://simplebiztoolkit-api-test.azurewebsites.net

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test
