name: PR Validation Quality Checks
# quality checks and playwright.
on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
      NEXT_PUBLIC_API_URL: https://simplebiztoolkit-api-test.azurewebsites.net
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder-secret-not-used-in-tests' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'ci@example.com' }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH || '$2b$10$placeholder' }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET || 'ci-revalidation-placeholder' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify API is reachable
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://simplebiztoolkit-api-test.azurewebsites.net/api/menuitems \
            > /dev/null

      - name: Run Playwright e2e tests
        run: npm run e2e
