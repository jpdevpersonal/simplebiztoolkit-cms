name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run test

      - name: Unit and API tests with coverage gates
        if: github.event_name != 'pull_request'
        run: npm run test:ci

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        if: github.event_name != 'pull_request'
        run: npm run e2e
