name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy_smoke_checks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-smoke-checks.yml
    with:
      api_url: https://simplebiztoolkit-api-live.azurewebsites.net
      skip_api_ping: ${{ vars['CI_SKIP_API_PING_PROD'] == 'true' }}
      skip_playwright_tests: ${{ vars['CI_SKIP_PLAYWRIGHT_PROD'] == 'true' }}
    secrets: inherit

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy_smoke_checks
    runs-on: ubuntu-latest
    name: Deploy to Azure

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          API_URL: https://simplebiztoolkit-api-live.azurewebsites.net
          NEXT_PUBLIC_API_URL: https://simplebiztoolkit-api-live.azurewebsites.net
          NEXT_PUBLIC_SHOW_FREE_GUIDE_BUTTON: "false"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_03FD06003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"
